<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Maple Wayfarer</title>
  <meta name="description" content=" " />
  <meta property="og:title" content="Maple Wayfarer" />
  <meta property="og:description" content=" " />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <canvas id="game" tabindex="0" aria-label="Game"></canvas>
  <section id="title" class="overlay hidden"></section>
  <div id="loading" class="loading-overlay">
    <div class="loading-simple">
      <div class="slime-bounce-wrap">
        <img id="loading-slime" class="slime-sprite" alt="Loading Slime" />
        <div class="slime-shadow"></div>
      </div>
      <script>
        (function() {
          var s = document.getElementById('loading-slime');
          if (s) {
            s.src = '/wz/sprite/Mob/0100100/move/2';
            s.onerror = function() { s.src = '/wz/sprite/Mob/0100100/stand/0'; };
          }
        })();
      </script>
      <div class="loading-status" id="loading-status">Connecting to Maple World…</div>
      <div class="loading-bar-wrap">
        <div class="loading-bar-fill" id="loading-bar-fill" style="width: 5%;"></div>
      </div>
      <div class="loading-meta">
        <span class="loading-sub" id="loading-sub">Loading Maple World & assets</span>
        <span class="loading-pct" id="loading-pct">5%</span>
      </div>
    </div>
  </div>
  <section id="gpu-error" class="overlay hidden">
    <div class="login"><h1>Graphics Error</h1><p>Hardware accelerated graphics are required. Please use a modern browser (Chrome, Edge, Firefox, or Safari).</p><p class="err-detail"></p></div>
  </section>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
